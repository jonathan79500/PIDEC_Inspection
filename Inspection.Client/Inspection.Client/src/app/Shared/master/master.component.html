<div class="master-form ostokhooniColor flex-col flex-wrap full-height">
  <!-- Top title -->
  <div class="section-title flex-1 full-height-20">Inspection</div>

  <!-- Top controls -->
  <div class="lightpinkColor flex-1 full-height-20">
    <div class="ostokhooniColor flex-row">
      <div class="flex-1 section-title">
        <button (click)="CreateNewInspectionNotification()">
          ایجاد یک بازرسی جدید
        </button>
      </div>
      <div class="flex-1 section-title">Inspection Report</div>
      <div class="flex-1 section-title">Tasks</div>
      <div class="flex-2">
        <select>
          <option value="null">--</option>
          @for(project of Projects; track project.id) {
          <option value="{{ project.id }}">
            {{ project.title }}
          </option>
          }
        </select>
      </div>
    </div>
  </div>

  <!-- Counts -->
  <div>
    {{ count() }} <br />
    {{ count2() }} <br />
    {{ count3() }}
    <button (click)="CountChange()">countChange</button>
    <input [(ngModel)]="title" />
  </div>

  <!-- Main content row -->
  <div class="flex-row">
    <!-- Sidebar -->
    <div class="blueColor flex-2 sidebar">
      <div class="flex-col flex-wrap full-height times-font">
        <div class="flex-1"></div>
        <div class="flex-1 link-item">
          <a routerLink="inspectionList">بازرسی های در لیست انتظار</a>
          <button (click)="goToInspectionList()">
            بازرسی های در لیست انتظار
          </button>
        </div>
        <div class="flex-1 link-item">
          <button (click)="gotoRejectedInspections()">
            بازرسی های در لیست انتظار
          </button>
          <a href="">بازرسی های در دست اقدام</a>
        </div>
        <div class="flex-1 link-item">
          <button (click)="gotoRejectedInspections()">بازرسی های برگشتی</button>
        </div>
        <div class="flex-1 link-item">
          <a href="">بازرسی های کارفرما</a>
        </div>
        <div class="flex-1 link-item">
          <a href="">بازرسی های تکمیل شده</a>
        </div>
        <div class="flex-10"></div>
      </div>
    </div>

    <!-- Main content -->
    <div class="ostokhooniColor flex-14 main-content">
      <router-outlet></router-outlet>
    </div>

    <!-- Right sidebar -->
    <div class="pinkColor flex-2 right-sidebar full-height">uowduoqu</div>
  </div>

  <!-- Footer -->
  <div class="flex-6">
    <ng-template [ngIf]="true"> render </ng-template>
  </div>

  <!-- Extra container -->
  <div class="container">
    <router-outlet></router-outlet>
  </div>
</div>
