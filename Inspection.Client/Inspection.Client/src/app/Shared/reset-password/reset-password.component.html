<div [formGroup]="fgResetPassword">
  <input type="hidden" formControlName="UserId" />
  <input type="hidden" formControlName="Token" />

  <div>
    <label for="newPass"></label>
    <input id="newPass" type="password" formControlName="newPass" />
  </div>

  <div>
    <label for="ConfirmPassword"></label>
    <input
      id="ConfirmPassword"
      type="password"
      formControlName="newPassConfirm"
    />
  </div>
  <div *ngIf="fgResetPassword.get('newPass')?.errors?.['required']">
    Password is required.
  </div>
  <button (click)="onSubmit()">Reset Password</button>
</div>
