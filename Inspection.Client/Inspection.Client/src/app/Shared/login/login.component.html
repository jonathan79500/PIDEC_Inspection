<div class="mb-4 h2 text-success">Sign up</div>
<form [formGroup]="form" (ngSubmit)="login()">
  <div class="mb-3">
    <input
      type="text"
      class="form-control bg-body-secondary"
      placeholder="User Name"
      formControlName="userName"
    />
    <div
      class="error-feedback"
      *ngIf="
        hasDisplayableError('userName') &&
        form.controls.userName.hasError('required')
      "
    >
      please Enter your Full Name
    </div>
  </div>

  <div class="mb-3">
    <input
      type="text"
      class="form-control bg-body-secondary"
      placeholder="Password"
      formControlName="password"
    />
    <div
      class="error-feedback"
      *ngIf="
        hasDisplayableError('password') &&
        form.controls.userName.hasError('required')
      "
    ></div>
  </div>
  <div class="mt-4">
    <button type="submit" class="btn btn-success w-100 rounded-3">Login</button>
  </div>
</form>
