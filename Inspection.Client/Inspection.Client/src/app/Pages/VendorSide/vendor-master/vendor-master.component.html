<div *ngIf="isLoading">
  <img src="../../../assets/close-icon" />
</div>
<div *ngIf="!isLoading">
  <!-- Display your vendor basic info here -->

  <div style="display: flex; flex-direction: row; background-color: #f6efff">
    <div style="flex: 1">
      <span>hello</span>
      <app-vleft-sidebar
        [isLeftSidebarCollapsed]="isLeftSidebarCollapsed()"
        (changeIsLeftSidebarCollapsed)="changeIsLeftSidebarCollapsed($event)"
      ></app-vleft-sidebar>
    </div>
    <div style="flex: 6; margin-left: 0">
      <div style="display: flex; flex-direction: column">
        <div style="flex: 1; margin-left: 0; position: relative">
          <app-vtop-menu [basicVendorInfo]="basicVendorInfo"></app-vtop-menu>
        </div>
        <div style="flex: 5; margin-left: 0">
          <app-vmain
            [isLeftSidebarCollapsed]="isLeftSidebarCollapsed()"
            [screenWidth]="screenWidth()"
          ></app-vmain>
        </div>
      </div>
    </div>
  </div>
</div>
