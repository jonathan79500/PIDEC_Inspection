<form id="newInspection" class="space-y-6">
  <fieldset class="newInspectionform">
    <h2 class="section-title">General Information</h2>

    <div class="subSection">
      <fieldset id="GeneralInfo" class="w-full">
        <div class="flex flex-col md:flex-row">
          <div class="flex-1 w-full">
            <!-- Notification Number -->
            <div class="mb-4">
              <label for="notificationNumber" class="theLabels"
                >Notification No:</label
              >
              <div class="relative">
                <input
                  id="notificationNumber"
                  name="notificationNumber"
                  type="text"
                  class="theInputs"
                />
              </div>
            </div>

            <!-- Date Pickers -->
            <div class="space-y-4 md:space-y-0 md:grid md:grid-cols-2 md:gap-4">
              <!-- Persian Date Picker -->
              <div class="date-picker-container">
                <label for="persianIssueDate" class="theLabels"
                  >Issue Date (Persian):</label
                >
                <div class="relative">
                  <input
                    type="text"
                    id="persianIssueDate"
                    name="persianIssueDate"
                    class="theInputs date-input"
                    placeholder="Select date"
                    readonly
                    data-format="persian"
                    data-linked="issueDate"
                    style="direction: ltr"
                  />
                  <div class="date-toggle" data-target="persianIssueDate">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <rect
                        x="3"
                        y="4"
                        width="18"
                        height="18"
                        rx="2"
                        ry="2"
                      ></rect>
                      <line x1="16" y1="2" x2="16" y2="6"></line>
                      <line x1="8" y1="2" x2="8" y2="6"></line>
                      <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                  </div>
                  <div id="persianIssueDate-dropdown" class="date-dropdown">
                    <div class="calendar-header">
                      <button type="button" class="prev-month">&lt;</button>
                      <span class="current-month-year">Farvardin 1402</span>
                      <button type="button" class="next-month">&gt;</button>
                    </div>
                    <div class="calendar-grid">
                      <div class="calendar-weekday">Sh</div>
                      <div class="calendar-weekday">Ye</div>
                      <div class="calendar-weekday">Do</div>
                      <div class="calendar-weekday">Se</div>
                      <div class="calendar-weekday">Ch</div>
                      <div class="calendar-weekday">Pa</div>
                      <div class="calendar-weekday">Jo</div>
                      <!-- Days will be populated by JavaScript -->
                    </div>
                    <div class="calendar-footer">
                      <button type="button" class="today-btn">Today</button>
                      <button type="button" class="close-btn">Close</button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Gregorian Date Picker -->
              <div class="date-picker-container">
                <label for="issueDate" class="theLabels"
                  >Issue Date (Gregorian):</label
                >
                <div class="relative">
                  <input
                    type="text"
                    id="issueDate"
                    name="issueDate"
                    class="theInputs date-input"
                    placeholder="Select date"
                    readonly
                    data-format="gregorian"
                    data-linked="persianIssueDate"
                    style="direction: ltr"
                  />
                  <div class="date-toggle" data-target="issueDate">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <rect
                        x="3"
                        y="4"
                        width="18"
                        height="18"
                        rx="2"
                        ry="2"
                      ></rect>
                      <line x1="16" y1="2" x2="16" y2="6"></line>
                      <line x1="8" y1="2" x2="8" y2="6"></line>
                      <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                  </div>
                  <div id="issueDate-dropdown" class="date-dropdown">
                    <div class="calendar-header">
                      <button type="button" class="prev-month">&lt;</button>
                      <span class="current-month-year">April 2023</span>
                      <button type="button" class="next-month">&gt;</button>
                    </div>
                    <div class="calendar-grid">
                      <div class="calendar-weekday">Su</div>
                      <div class="calendar-weekday">Mo</div>
                      <div class="calendar-weekday">Tu</div>
                      <div class="calendar-weekday">We</div>
                      <div class="calendar-weekday">Th</div>
                      <div class="calendar-weekday">Fr</div>
                      <div class="calendar-weekday">Sa</div>
                      <!-- Days will be populated by JavaScript -->
                    </div>
                    <div class="calendar-footer">
                      <button type="button" class="today-btn">Today</button>
                      <button type="button" class="close-btn">Close</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Additional Fields -->
            <div
              class="mt-6 space-y-4 md:space-y-0 md:grid md:grid-cols-2 md:gap-4"
            >
              <div>
                <label for="inspectionType" class="theLabels"
                  >Inspection Type:</label
                >
                <select
                  id="inspectionType"
                  name="inspectionType"
                  class="theInputs"
                >
                  <option value="">Select type</option>
                  <option value="initial">Initial</option>
                  <option value="followup">Follow-up</option>
                  <option value="final">Final</option>
                </select>
              </div>

              <div>
                <label for="priority" class="theLabels">Priority:</label>
                <select id="priority" name="priority" class="theInputs">
                  <option value="">Select priority</option>
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                  <option value="urgent">Urgent</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </fieldset>
    </div>

    <!-- Vendor Information Section -->
    <div class="subSection mt-8">
      <h2 class="section-title">Vendor Information</h2>

      <div class="space-y-4 md:space-y-0 md:grid md:grid-cols-2 md:gap-4">
        <div>
          <label for="vendorName" class="theLabels">Vendor Name:</label>
          <input
            type="text"
            id="vendorName"
            name="vendorName"
            class="theInputs"
          />
        </div>

        <div>
          <label for="vendorId" class="theLabels">Vendor ID:</label>
          <input type="text" id="vendorId" name="vendorId" class="theInputs" />
        </div>

        <div>
          <label for="contactPerson" class="theLabels">Contact Person:</label>
          <input
            type="text"
            id="contactPerson"
            name="contactPerson"
            class="theInputs"
          />
        </div>

        <div>
          <label for="contactEmail" class="theLabels">Contact Email:</label>
          <input
            type="email"
            id="contactEmail"
            name="contactEmail"
            class="theInputs"
          />
        </div>
      </div>
    </div>

    <!-- Inspection Details Section -->
    <div class="subSection mt-8">
      <h2 class="section-title">Inspection Details</h2>

      <div class="space-y-4">
        <div class="space-y-4 md:space-y-0 md:grid md:grid-cols-2 md:gap-4">
          <div class="date-picker-container">
            <label for="scheduledDate" class="theLabels">Scheduled Date:</label>
            <div class="relative">
              <input
                type="text"
                id="scheduledDate"
                name="scheduledDate"
                class="theInputs date-input"
                placeholder="Select date"
                readonly
                data-format="gregorian"
              />
              <div class="date-toggle" data-target="scheduledDate">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </div>
              <div id="scheduledDate-dropdown" class="date-dropdown">
                <div class="calendar-header">
                  <button type="button" class="prev-month">&lt;</button>
                  <span class="current-month-year">April 2023</span>
                  <button type="button" class="next-month">&gt;</button>
                </div>
                <div class="calendar-grid">
                  <div class="calendar-weekday">Su</div>
                  <div class="calendar-weekday">Mo</div>
                  <div class="calendar-weekday">Tu</div>
                  <div class="calendar-weekday">We</div>
                  <div class="calendar-weekday">Th</div>
                  <div class="calendar-weekday">Fr</div>
                  <div class="calendar-weekday">Sa</div>
                  <!-- Days will be populated by JavaScript -->
                </div>
                <div class="calendar-footer">
                  <button type="button" class="today-btn">Today</button>
                  <button type="button" class="close-btn">Close</button>
                </div>
              </div>
            </div>
          </div>

          <div>
            <label for="location" class="theLabels">Location:</label>
            <input
              type="text"
              id="location"
              name="location"
              class="theInputs"
            />
          </div>
        </div>

        <div>
          <label for="description" class="theLabels">Description:</label>
          <textarea
            id="description"
            name="description"
            rows="3"
            class="theInputs"
          ></textarea>
        </div>

        <div class="space-y-4 md:space-y-0 md:grid md:grid-cols-2 md:gap-4">
          <div>
            <label for="inspectors" class="theLabels"
              >Number of Inspectors:</label
            >
            <input
              type="number"
              id="inspectors"
              name="inspectors"
              min="1"
              class="theInputs"
            />
          </div>

          <div>
            <label for="duration" class="theLabels"
              >Expected Duration (hours):</label
            >
            <input
              type="number"
              id="duration"
              name="duration"
              min="1"
              class="theInputs"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div
      class="mt-8 flex flex-col sm:flex-row justify-end space-y-3 sm:space-y-0 sm:space-x-3"
    >
      <button
        type="button"
        class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 transition-colors"
      >
        Cancel
      </button>
      <button
        type="button"
        class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors"
      >
        Save Draft
      </button>
      <button
        type="submit"
        class="px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition-colors"
      >
        Submit
      </button>
    </div>
  </fieldset>
</form>
