<div *ngIf="isLoading" class="loading-screen">
  <img src="assets/close-icon" alt="Loading..." />
</div>
<div *ngIf="!isLoading" class="inspectorscreen">
  <!-- Display your vendor basic info here -->

  <div class="vendor-row">
    <!-- Left sidebar -->
    <div class="vendor-left flex-1">
      <span>hello</span>
      <app-insleft-sidebar
        [isLeftSidebarCollapsed]="isLeftSidebarCollapsed()"
        (changeIsLeftSidebarCollapsed)="changeIsLeftSidebarCollapsed($event)"
      ></app-insleft-sidebar>
    </div>
    <!-- Main content -->
    <div class="vendor-main flex-6">
      <div class="flex-col">
        <div class="vendor-top flex-1">
          <app-instop-menu
            [basicInspectorInfo]="basicInspectorInfo"
          ></app-instop-menu>
        </div>
        <div class="vendor-body flex-5">
          <app-ins-main
            [isLeftSidebarCollapsed]="isLeftSidebarCollapsed()"
            [screenWidth]="screenWidth()"
          ></app-ins-main>
        </div>
      </div>
    </div>
  </div>
</div>
