<div class="inspectionList">
  <div>
    <table
      mat-table
      [dataSource]="dataSource"
      class="mat-elevation-z8 demo-table"
      #inspectionTable
    >
      <ng-container matColumnDef="name" style="width: 5rem">
        <th
          mat-header-cell
          *matHeaderCellDef
          style="text-align: right; width: 5rem; background-color: #123c69"
        >
          <div class="row">
            <div class="col-md-12">
              <span
                class="headerText"
                mat-sort-header
                sortActionDescription="Sort by description"
                style="
                  display: block;
                  width: 5rem;
                  height: 100%;
                  margin: 0 auto;
                "
              >
                Name
              </span>
            </div>
          </div>
        </th>
        <td
          mat-cell
          *matCellDef="let element"
          style="width: 5rem; color: #123c69; text-align: center !important"
        >
          {{ element.name! }}
        </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="notificationNumber" style="width: 7rem">
        <th
          mat-header-cell
          *matHeaderCellDef
          style="text-align: right; width: 7rem; background-color: #123c69"
        >
          <div class="row">
            <div class="col-md-12">
              <span
                class="headerText"
                mat-sort-header
                sortActionDescription="Sort by notificationNumber"
                style="display: block; width: 7rem; height: 90%; margin: 0 auto"
              >
                Notification Number
              </span>
            </div>
          </div>
        </th>
        <td
          mat-cell
          *matCellDef="let element"
          style="width: 5rem; color: #123c69; text-align: center !important"
        >
          {{ element.notificationNumber! }}
        </td>
      </ng-container>

      <ng-container
        matColumnDef="inspectionType.name"
        style="width: 5rem; color: #123c69"
      >
        <th
          mat-header-cell
          *matHeaderCellDef
          style="text-align: right; width: 5rem; background-color: #123c69"
        >
          <div class="row">
            <div class="col-md-12">
              <span
                class="headerText"
                mat-sort-header
                sortActionDescription="Sort by inspectionType.id"
                style="display: block; width: 6rem; height: 90%; margin: 0 auto"
              >
                Inspection Type
              </span>
            </div>
          </div>
        </th>
        <td
          mat-cell
          *matCellDef="let element"
          style="width: 5rem; color: #123c69; text-align: center !important"
        >
          {{
            element.inspectionType == null ? "" : element.inspectionType!.name!
          }}
        </td>
      </ng-container>

      <!-- Weight Column -->
      <ng-container matColumnDef="inspectionSubject" style="width: 5rem">
        <th
          mat-header-cell
          *matHeaderCellDef
          style="text-align: right; width: 5rem; background-color: #123c69"
        >
          <div class="row">
            <div class="col-md-12">
              <span
                class="headerText"
                mat-sort-header
                sortActionDescription="Sort by inspectionSubject"
                style="display: block; width: 6rem; height: 90%; margin: 0 auto"
              >
                Inspection Subject
              </span>
            </div>
          </div>
        </th>
        <td
          mat-cell
          *matCellDef="let element"
          style="width: 5rem; color: #123c69; text-align: center !important"
        >
          {{ element.inspectionSubject! }}
        </td>
      </ng-container>
      <ng-container matColumnDef="order.name" style="width: 5rem">
        <th
          mat-header-cell
          *matHeaderCellDef
          style="text-align: right; width: 5rem; background-color: #123c69"
        >
          <div class="row">
            <div class="col-md-12">
              <span
                class="headerText"
                mat-sort-header
                sortActionDescription="Sort by order.name"
                style="display: block; width: 6rem; height: 90%; margin: 0 auto"
              >
                Order Name
              </span>
            </div>
          </div>
        </th>
        <td
          mat-cell
          *matCellDef="let element"
          style="width: 5rem; color: #123c69; text-align: center !important"
        >
          {{ element.order!.name! }}
        </td>
      </ng-container>
      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns; sticky: true"
        style="text-align: right; width: 5rem"
      ></tr>
      <tr
        mat-row
        (click)="clickInspectionRow(row)"
        [class.demo-row-is-clicked]="clickedRows.has(row)"
        *matRowDef="let row; columns: displayedColumns"
      ></tr>
    </table>
  </div>
</div>
